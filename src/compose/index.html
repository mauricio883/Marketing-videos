<!doctype html>
<html><head><meta charset="utf-8"><title>Composition</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="mg.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'pods-hero';
  const W = parseInt(q.get('w') || '1080', 10), H = parseInt(q.get('h') || '1920', 10);
  const fps = parseInt(q.get('fps') || '30', 10);
  const media = q.get('media') || '../../media/src';
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  Object.assign(Comp.state, { width: W, height: H, fps });
  window.MEDIA = media;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = `scenes/${scene}.js?v=${Date.now()}`; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  if (typeof window.buildScene !== 'function') throw new Error('scene did not define buildScene');
  const info = window.buildScene({ W, H, fps, media, UI, MG, Comp }) || {};
  Comp.state.duration = info.duration || Comp.state.duration;
  await Comp.ready();
  await Comp.seek(0);
  window.__seek = (t) => Comp.seek(t);
  window.__info = { duration: Comp.state.duration, W, H, fps, clips: Comp.clips.length };
  window.__ready = true;
})().catch((e) => { window.__error = String(e && e.stack || e); console.error(e); });
</script>
</body></html>
